# Development override for docker-compose
version: "3.8"

services:
  backend:
    build:
      context: ./backend
      target: development
    volumes:
      - ./backend:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
    command: npm run dev
    
  frontend:
    volumes:
      - ./frontend:/usr/share/nginx/html:ro